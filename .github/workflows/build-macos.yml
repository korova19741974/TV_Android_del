name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'
      - name: Build release APK
        working-directory: launcher
        run: |
          chmod +x gradlew build-and-install.sh
          ./gradlew testReleaseUnitTest assembleRelease --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  macos-app:
    needs: android-apk
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: intel
          - runner: macos-latest
            architecture: apple-silicon
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: launcher-apk
          path: launcher/app/build/outputs/apk/release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build application and DMG
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          chmod +x desktop/build-macos.sh
          ./desktop/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-macOS-${{ matrix.architecture }}
          path: desktop/dist-macos/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: macos-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publish DMG files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find release-assets -type f -name '*.dmg' -print)
          gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "CleanYourTV ${GITHUB_REF_NAME}" \
            --notes "Графическая версия CleanYourTV для macOS. Выберите DMG для Intel или Apple Silicon." \
            --verify-tag
